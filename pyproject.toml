[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mosses"
version = "0.6.1"
description = "Set of functionalities to assess molecular property prediction models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Vigneshwari Subramanian", email = "vignesh.bioinfo@gmail.com"},
    {name = "Gian Marco Ghiandoni", email = "ghiandoni.g@gmail.com"},
    {name = "Evgeny Maximov", email = "esmaksimov@gmail.com"},
    {name = "Nagarajan P S", email = "nagarajan.seshathiri@gmail.com"}
]
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "pandas>=2.1",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "colorama",
    "seaborn",
    "pyyaml",
    "jinja2",
    "imbalanced-learn",
    "pygad>=3.0",
    "matplotlib-venn",
    "rdkit"
]

[project.urls]
Homepage = "https://github.com/AstraZeneca/mosses"
Issues = "https://github.com/AstraZeneca/mosses/issues"

[dependency-groups]
dev = [
    "build",
    "ipykernel>=7.1.0",
    "pip>=25.3",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
]
